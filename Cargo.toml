[package]
name = "gossip-rs"
version = "0.1.0"
edition = "2024"
authors = ["Sarthak"]
description = "solana's gossip protocol (agave core) over udp: signed crds, push with prunes, pull with bloom filters, ping/pong"
repository = "https://github.com/Not-Sarthak/gossip-rs"
license = "MIT"
readme = "README.md"

[dependencies]
bincode = "1.3.3"
bs58 = "0.5.1"
clap = { version = "4.6", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", features = ["serde"] }
fnv = "1.0.7"
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
